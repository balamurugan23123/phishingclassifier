[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "venv", "__pycache__"]

[tool.ruff.lint]
# Conservative, correctness-focused ruleset that the codebase passes today.
# E4/E7/E9 = real pycodestyle issues, F = pyflakes (unused imports/vars,
# undefined names). Broader style rules (I, UP) are intentionally left off
# until the code is cleaned up.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# dashboard/app.py inserts the repo root on sys.path before importing the
# package, so its imports are legitimately below the top of the file.
"dashboard/app.py" = ["E402"]

